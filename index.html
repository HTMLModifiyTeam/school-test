<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>School test</title>
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/examples/jsm/controls/PointerLockControls.js": "https://threejs.org/examples/jsm/controls/PointerLockControls.js"
      }
    }
    </script>
  </head>

  <body>
    <canvas id="c"></canvas>
    <canvas id="minimap" width="240" height="240"></canvas>
    <div id="notebookCounter"></div>

    <!-- Points HUD: bottom-center main label + floating earned text -->
    <div id="pointsContainer" aria-live="polite" style="display:block;">
      <div id="pointsFloating" class="points-floating" aria-hidden="true"></div>
      <div id="pointsMain" class="points-main">points: 0</div>
    </div>
    <div id="seedDisplay"></div>
    <div id="difficultyDisplay"></div>
    <div id="floorDisplay"></div>
    <div id="fpsDisplay">0fps</div>
    <div id="restartConfirm">are you sure? press r to restart</div>
    <!-- pause overlay -->
    <div id="pauseOverlay">
      <div>paused</div>
      <button id="pauseRestartBtn">restart</button>
    </div>
    <!-- win overlay -->
    <div id="winOverlay">
      <img id="winImage" src="./assets/img/Winner.png" alt="Win Screen">
    </div>
    <!-- NEW: Crosshair -->
    <div id="crosshair">+</div>
    <!-- NEW: Stamina Bar -->
    <div id="staminaContainer">
      <div id="staminaBar"></div>
    </div>
    <!-- main menu -->
    <div id="mainMenu">
      <img src="./assets/img/thumb.png" alt="Main Menu">
      <div id="difficultyUI">difficulty: normal</div>
      <div id="seedUI">seed: </div>

      <!-- Level generation settings -->
      <div id="levelSettings"
        style="position: absolute; left: 25px; top: 50%; z-index:220; color:#000; font-family:TimesNewRoman, serif; transform: translateY(-50%) scale(1.1);">
        <div style="margin-bottom:6px; font-size:14px;">level generation</div>
        <label style="display:block; margin-bottom:4px;">
          Attempts:
          <input id="levelAttemptsInput" type="number" min="50" max="2000" step="10" value="800" style="width:86px; margin-left:8px;" />
        </label>
        <label style="display:block; margin-bottom:4px;">
          Target rooms:
          <input id="levelRoomsInput" type="number" min="3" max="120" step="1" value="12" style="width:86px; margin-left:8px;" />
        </label>
        <label style="display:block; margin-top:6px;">
          Start floor:
          <select id="levelStartFloorSelect" style="width:100px; margin-left:8px;">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <label style="display:block; margin-top:6px;">
          Modify Room Size X:
          <input id="roomSizeXInput" type="number" min="1" max="20" step="1" value="5" style="width:86px; margin-left:8px;" />
        </label>
        <label style="display:block; margin-top:4px;">
          Modify Room Size Z:
          <input id="roomSizeZInput" type="number" min="1" max="20" step="1" value="4" style="width:86px; margin-left:8px;" />
        </label>

        <!-- NEW: Corrupt Maze / Max Exits / Bypass Notebook Limit / Bypass Elevator -->
        <label style="display:block; margin-top:8px;">
          Max exits:
          <input id="levelMaxExitsInput" type="number" min="1" max="12" step="1" value="4" style="width:86px; margin-left:8px;" />
        </label>

        <!-- NEW: Max floors for level generation -->
        <label style="display:block; margin-top:6px;">
          Max floors:
          <input id="levelMaxFloorsInput" type="number" min="1" max="20" step="1" value="5" style="width:86px; margin-left:8px;" />
        </label>

        <label style="display:block; margin-top:6px; gap:8px; align-items:center;">
          <input id="levelCorruptMazeChk" type="checkbox" /> Corrupt maze (random holes)
        </label>

        <!-- NEW: Spawn Other Characters (excluding principal) -->
        <label style="display:block; margin-top:6px; gap:8px; align-items:center;">
          <input id="spawnOtherCharChk" type="checkbox" checked /> Spawn other characters
        </label>

        <!-- NEW: Save / Load level generation settings -->
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
          <button id="saveLevelSettingsBtn" style="padding:6px; border:1px solid #666; background:transparent; color:#000; cursor:pointer;">Save level settings</button>
          <button id="loadLevelSettingsBtn" style="padding:6px; border:1px solid #666; background:transparent; color:#000; cursor:pointer;">Load settings</button>
          <input id="levelSettingsFileInput" type="file" accept="application/json" style="display:none" />
        </div>
      </div>

      <button id="showInfoToggleButton">enable info display</button>
      <button id="playButton">play</button>
      <button id="modeToggleButton">switch to hd</button>
      <button id="loudnessToggleButton">disable loudness</button>
      <button id="peacefulModeButton">peaceful: off</button>
      <!-- Hidden input for mobile seed entry -->
      <input id="seedInputHidden" type="text" style="position: absolute; opacity: 0; pointer-events: none; z-index: -1;" />
    </div>

    <!-- Mod Menu (toggle with backtick ` ) -->
    <div id="modMenu" style="display:none;" role="dialog" aria-label="Mod menu">
      <div id="modMenuHeader">
        <span>mod menu</span>
        
      </div>
      <input id="modSearch" type="search" placeholder="filter options..." autocomplete="off" />

      <div id="modMenuBody">
        <details class="mod-section" open>
          <summary>player</summary>
          <label class="mod-row"><input type="checkbox" id="modInvincible" /><span>god mode</span></label>
          <label class="mod-row"><input type="checkbox" id="modSuperSpeed" /><span>super speed</span></label>
          <label class="mod-row"><input type="checkbox" id="modInfStamina" /><span>inf stamina</span></label>
          <label class="mod-row"><input type="checkbox" id="modNoclip" /><span>noclip</span></label>
        </details>

        <details class="mod-section">
          <summary>characters</summary>
          <label class="mod-row"><input type="checkbox" id="modPrincipalIgnore" /><span>principal ignores player</span></label>
          <label class="mod-row"><input type="checkbox" id="modBullyNoSteal" /><span>bully ignores player</span></label>
        </details>

        <details class="mod-section">
          <summary>display</summary>
          <label class="mod-row"><input type="checkbox" id="modNoDarkBtn" /><span>full bright</span></label>
          <label class="mod-row"><input type="checkbox" id="modBaldiIcon" /><span>baldi icon on minimap</span></label>
        </details>

        <details class="mod-section">
          <summary>items</summary>
          <label class="mod-row"><input type="checkbox" id="modInfItems" /><span>inf items</span></label>
          <div class="mod-item-row">
            <select id="modItemSelect">
              <optgroup label="items">
                <option value="blue_soda">Blue Soda</option>
                <option value="purple_chocolate">Purple Chocolate</option>
                <option value="walkie_talkie">Walkie Talkie</option>
                <option value="wd40">WD40</option>
                <option value="old_boots">Old Boots</option>
              </optgroup>
              <optgroup label="points">
                <option value="point_orange">Point (Orange)</option>
                <option value="point_green">Point (Green)</option>
                <option value="point_pink">Point (Pink)</option>
                <option value="point_mega">Point (Mega)</option>
              </optgroup>
            </select>
            <button id="modGetItemBtn" class="mod-btn">get item</button>
          </div>
        </details>

        <details class="mod-section">
          <summary>world</summary>
          <button id="modTpNotebooksBtn" class="mod-btn">tp notebooks to player</button>
          <button id="modNextLevelBtn" class="mod-btn">next level</button>
        </details>

        <div id="modNoMatch">no options match</div>
      </div>

      <div id="modMenuFooter">` to toggle</div>
    </div>
    <script>
      // Mod menu UI only (drag, filter, remember position/sections). Game logic stays in main.js.
      (function () {
        var menu = document.getElementById('modMenu');
        var header = document.getElementById('modMenuHeader');
        var search = document.getElementById('modSearch');
        var sections = menu.querySelectorAll('.mod-section');
        var noMatch = document.getElementById('modNoMatch');
        var KEY = 'modMenuUI';
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
        function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

        // restore position (clamped to viewport) and collapsed sections
        if (typeof saved.x === 'number') {
          menu.style.left = Math.max(0, Math.min(saved.x, innerWidth - 80)) + 'px';
          menu.style.top = Math.max(0, Math.min(saved.y, innerHeight - 40)) + 'px';
        }
        sections.forEach(function (s, i) {
          if (saved.open) s.open = saved.open.indexOf(i) !== -1;
          s.addEventListener('toggle', function () {
            saved.open = [];
            sections.forEach(function (t, j) { if (t.open) saved.open.push(j); });
            save();
          });
        });

        // drag by header
        var drag = null;
        header.addEventListener('pointerdown', function (e) {
          var r = menu.getBoundingClientRect();
          drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
          header.setPointerCapture(e.pointerId);
        });
        header.addEventListener('pointermove', function (e) {
          if (!drag) return;
          var x = Math.max(0, Math.min(e.clientX - drag.dx, innerWidth - 80));
          var y = Math.max(0, Math.min(e.clientY - drag.dy, innerHeight - 40));
          menu.style.left = x + 'px';
          menu.style.top = y + 'px';
          saved.x = x; saved.y = y;
        });
        header.addEventListener('pointerup', function () { if (drag) { drag = null; save(); } });

        // filter
        search.addEventListener('input', function () {
          var q = search.value.trim().toLowerCase();
          var anyShown = false;
          sections.forEach(function (s) {
            var shown = 0;
            s.querySelectorAll('.mod-row, .mod-item-row, .mod-btn').forEach(function (el) {
              if (el.closest('.mod-item-row') && el.classList.contains('mod-btn')) return;
              var hit = !q || el.textContent.toLowerCase().indexOf(q) !== -1;
              el.style.display = hit ? '' : 'none';
              if (hit) shown++;
            });
            s.style.display = shown ? '' : 'none';
            if (q && shown) s.open = true;
            if (shown) anyShown = true;
          });
          noMatch.style.display = anyShown ? 'none' : 'block';
        });
        // keep typing in the search box from triggering game hotkeys
        search.addEventListener('keydown', function (e) { if (e.key !== '`') e.stopPropagation(); });
      })();
    </script>

    <!-- inventory hud -->
    <div id="inventory">
      <div id="useItemButton" class="inv-slot" style="display: none;">USE</div>
      <div class="inv-slot" data-slot="0"><img class="inv-icon" /></div>
      <div class="inv-slot" data-slot="1"><img class="inv-icon" /></div>
      <div class="inv-slot" data-slot="2"><img class="inv-icon" /></div>
      <div class="inv-slot" data-slot="3"><img class="inv-icon" /></div>
      <div class="inv-slot" data-slot="4"><img class="inv-icon" /></div>
    </div>
    <img id="baldicator" src="" alt="Baldicator">
    <!-- mobile pause button -->
    <button id="pauseButton" aria-label="Pause"></button>
    <!-- NEW: look behind button for mobile -->
    <button id="lookBehindButton" aria-label="Look Behind">↻</button>
    <!-- mobile joystick -->
    <div id="joystick">
      <div id="joystick-base"></div>
      <div id="joystick-stick"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
